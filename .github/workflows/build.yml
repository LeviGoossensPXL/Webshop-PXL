name: build

permissions:
  contents: read

on:
  push:
    branches:
      - 4-cd-build-docker-image

jobs:
  docker-build:
    strategy: 
      fail-fast: false
      matrix:
        include:
          - image: webshop-webapp
            dockerfile: Webshop.website/Dockerfile
          - image: webshop-webapi
            dockerfile: WebApi.webapi/Dockerfile
          - image: webshop-duende
            dockerfile: DuendeIdentityServer/Dockerfile
    
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}