services:
  webshop.website:
    image: docker.io/darklord200/webapp:latest
    build:
      context: .
      dockerfile: ./Webshop.website/Dockerfile
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebsiteDB=Host=website.database;Port=5432;Database=${WebsiteDB_Database};Username=${WebsiteDB_Username};Password=${WebsiteDB_Password}
    networks:
      - webshop-network
    ports:
      - "8077:8080"
    depends_on:
      website.database:
        condition: service_healthy
  
  website.database:
    image: postgres:18
    environment:
      - POSTGRES_DB=$WebsiteDB_Database
      - POSTGRES_USER=$WebsiteDB_Username
      - POSTGRES_PASSWORD=$WebsiteDB_Password
    networks:
      - webshop-network
    volumes:
      - "website-db:/var/lib/postgresql"
    ports:
      - "${WebsiteDB_Port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  webshop.webapi:
    image: docker.io/darklord200/webapi:latest
    build:
      context: .
      dockerfile: ./WebApi.webapi/Dockerfile
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebapiDB=Host=webapi.database;Port=5432;Database=${WebapiDB_Database};Username=${WebapiDB_Username};Password=${WebapiDB_Password}
    networks:
      - webshop-network
    ports:
      - "8078:8080"
    depends_on:
      webapi.database:
        condition: service_healthy
  
  webapi.database:
    image: postgres:18
    environment:
      - POSTGRES_DB=$WebapiDB_Database
      - POSTGRES_USER=$WebapiDB_Username
      - POSTGRES_PASSWORD=$WebapiDB_Password
    networks:
      - webshop-network
    volumes:
      - "webapi-db:/var/lib/postgresql"
    ports:
      - "${WebapiDB_Port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  webshop.duende:
    image: docker.io/darklord200/duende:latest
    build:
      context: .
      dockerfile: ./DuendeIdentityServer/Dockerfile
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebsiteDB=Host=website.database;Port=5432;Database=${WebsiteDB_Database};Username=${WebsiteDB_Username};Password=${WebsiteDB_Password}
    networks:
      - webshop-network
    ports:
      - "8080:8080"
    depends_on:
      website.database:
        condition: service_healthy

volumes:
  website-db:
  webapi-db:
networks:
  webshop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: $ProxyIP
