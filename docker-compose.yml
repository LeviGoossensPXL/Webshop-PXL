services:
  webshop.website:
    image: docker.io/darklord200/webapp:latest
    build:
      context: .
      dockerfile: webapp.Dockerfile
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebsiteDatabase=Host=website.database;Port=5432;Database=${WebsiteDatabase_Database};Username=${WebsiteDatabase_Username};Password=${WebsiteDatabase_Password}
    networks:
      - webshop-network
    ports:
      - "8077:8080"
    depends_on:
      website.database:
        condition: service_healthy
  
  website.database:
    image: postgres:18
    environment:
      - POSTGRES_DB=$WebsiteDatabase_Database
      - POSTGRES_USER=$WebsiteDatabase_Username
      - POSTGRES_PASSWORD=$WebsiteDatabase_Password
    networks:
      - webshop-network
    volumes:
      - "website-db:/var/lib/postgresql"
    ports:
      - "${WebsiteDatabase_Port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  webshop.webapi:
    image: docker.io/darklord200/webapi:latest
    build:
      context: .
      dockerfile: webapi.Dockerfile
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WebapiDatabase=Host=webapi.database;Port=5432;Database=${WebapiDatabase_Database};Username=${WebapiDatabase_Username};Password=${WebapiDatabase_Password}
    networks:
      - webshop-network
    ports:
      - "8078:8080"
    depends_on:
      webapi.database:
        condition: service_healthy
  
  webapi.database:
    image: postgres:18
    environment:
      - POSTGRES_DB=$WebapiDatabase_Database
      - POSTGRES_USER=$WebapiDatabase_Username
      - POSTGRES_PASSWORD=$WebapiDatabase_Password
    networks:
      - webshop-network
    volumes:
      - "webapi-db:/var/lib/postgresql"
    ports:
      - "${WebapiDatabase_Port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  webshop.duende:
    image: docker.io/darklord200/duende:latest
    build:
      context: .
      dockerfile: ./DuendeIdentityServer/Duende.Dockerfile
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - webshop-network
    ports:
      - "8080:8080"
    depends_on:
      website.database:
        condition: service_healthy

volumes:
  website-db:
  webapi-db:
networks:
  webshop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: $ProxyIP
